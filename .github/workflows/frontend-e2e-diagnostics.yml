name: Frontend E2E diagnostics

on:
  push:
    paths:
      - '.github/workflows/frontend-e2e-diagnostics.yml'

permissions:
  contents: read

jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver library
        run: npm install --no-save puppeteer-core@24
      - name: Audit production interactions
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const assert = require('node:assert/strict');
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox','--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            page.setDefaultTimeout(120000);
            const consoleErrors = [];
            page.on('console', msg => {
              const text = msg.text();
              if (msg.type() === 'error') consoleErrors.push(text);
              console.log('BROWSER', msg.type(), text);
            });
            page.on('pageerror', err => {
              consoleErrors.push('PAGEERROR ' + err.message);
              console.log('PAGEERROR', err.message);
            });
            page.on('requestfailed', req => console.log('REQUEST_FAILED', req.url(), req.failure()?.errorText));

            await page.goto('https://mralehsas.github.io/ALBAZ-ASTEROID-ARCHIVE/?e2e=' + Date.now(), {
              waitUntil:'networkidle2', timeout:120000
            });
            await page.waitForFunction(() => document.querySelector('#connectionText')?.textContent.includes('Backend Online'), {timeout:30000});
            if ((await page.$eval('html', e => e.lang)) === 'ar') await page.click('#languageButton');
            console.log('BOOT', JSON.stringify(await page.evaluate(() => ({
              connection: document.querySelector('#connectionText')?.textContent,
              loaded: document.querySelector('#loadedRecordsValue')?.textContent,
              source: document.querySelector('#sourceModeValue')?.textContent,
              approaches: document.querySelector('#approachesCount')?.textContent,
              fireballs: document.querySelector('#fireballsCount')?.textContent,
            }))));

            // 1) Pure scientific mass / kinetic-energy calculation.
            await page.click('[data-view-target="analyzer"]');
            await page.waitForSelector('#analyzerForm');
            await page.evaluate(() => {
              document.querySelector('#analyzerDiameter').value = '20';
              document.querySelector('#analyzerDensity').value = '3000';
              document.querySelector('#analyzerSpeed').value = '19';
              document.querySelector('#analyzerForm').requestSubmit();
            });
            const analyzer = await page.evaluate(() => ({
              volume: document.querySelector('#resultVolume')?.textContent || '',
              mass: document.querySelector('#resultMass')?.textContent || '',
              energy: document.querySelector('#resultEnergy')?.textContent || '',
              tnt: document.querySelector('#resultTnt')?.textContent || '',
            }));
            console.log('ANALYZER', JSON.stringify(analyzer));
            for (const [key, value] of Object.entries(analyzer)) {
              assert.ok(value.trim() && value.trim() !== '—', `Analyzer ${key} did not calculate`);
            }
            // Independent known-value reference for the same formula.
            const expected = {
              volume: 4188.790204786391,
              mass: 12566370.614359172,
              energy: 2.2682298958918305e15,
              tnt: 0.5421199559970914,
            };
            const reference = await page.evaluate(() => {
              const d = 20, density = 3000, speed = 19000;
              const volume = Math.PI / 6 * d ** 3;
              const mass = volume * density;
              const energy = 0.5 * mass * speed ** 2;
              return {volume, mass, energy, tnt: energy / 4.184e15};
            });
            for (const key of Object.keys(expected)) {
              assert.ok(Math.abs(reference[key] - expected[key]) <= Math.abs(expected[key]) * 1e-12 + 1e-12, `Reference mismatch: ${key}`);
            }

            // 2) Live SBDB object + comparison calculations.
            await page.click('[data-view-target="compare"]');
            await page.waitForSelector('#compareObjectSearch');
            await page.evaluate(() => { document.querySelector('#compareObjectSearch').value = '99942'; });
            await page.$eval('#compareSearchForm', form => form.requestSubmit());
            await page.waitForFunction(() => {
              const cards = document.querySelector('#compareCards')?.textContent || '';
              return !document.querySelector('#compareContent')?.hidden && /Apophis/i.test(cards);
            }, {timeout:60000});
            const compareText = await page.$eval('#compareCards', e => e.textContent.replace(/\s+/g,' ').trim());
            console.log('COMPARE', compareText.slice(0,1200));
            assert.match(compareText, /Apophis/i);

            // 3) Manual live Horizons trajectory calculation.
            await page.click('[data-view-target="orbit"]');
            await page.evaluate(() => {
              document.querySelector('#orbitTarget').value = '99942';
              document.querySelector('#orbitDays').value = '10';
              document.querySelector('#orbitStep').value = '2';
              document.querySelector('#orbitForm').requestSubmit();
            });
            await page.waitForFunction(() => document.querySelector('#orbitMetricSource')?.textContent.trim() === 'HORIZONS', {timeout:120000});
            const orbit = await page.evaluate(() => ({
              source: document.querySelector('#orbitMetricSource')?.textContent,
              points: document.querySelector('#orbitMetricPoints')?.textContent,
              nearest: document.querySelector('#orbitMetricNearest')?.textContent,
            }));
            console.log('ORBIT_MANUAL', JSON.stringify(orbit));
            assert.equal((orbit.source || '').trim(), 'HORIZONS');
            assert.ok((orbit.points || '').trim() && (orbit.points || '').trim() !== '—');

            // 4) Wait separately for live approach data, then test selected-object quick orbit.
            await page.click('[data-view-target="approaches"]');
            await page.waitForSelector('button.table-action[data-approach-index]', {timeout:90000});
            await page.click('button.table-action[data-approach-index]');
            await page.waitForFunction(() => !document.querySelector('#openOrbitButton')?.disabled, {timeout:10000});
            const selected = await page.evaluate(() => ({
              title: document.querySelector('#selectedTitle')?.textContent,
              openOrbitDisabled: document.querySelector('#openOrbitButton')?.disabled,
            }));
            console.log('SELECTED', JSON.stringify(selected));

            // Deliberately set LOCAL first so the quick-action behavior is observable.
            await page.click('[data-view-target="orbit"]');
            await page.click('#loadReferenceOrbitButton');
            await page.waitForFunction(() => document.querySelector('#orbitMetricSource')?.textContent.trim() === 'LOCAL', {timeout:10000});
            await page.click('[data-view-target="approaches"]');
            await page.click('#openOrbitButton');
            await sleep(7000);
            const quickOrbit = await page.evaluate(() => ({
              source: document.querySelector('#orbitMetricSource')?.textContent?.trim(),
              target: document.querySelector('#orbitTarget')?.value,
              viewActive: document.querySelector('#view-orbit')?.classList.contains('active'),
            }));
            console.log('ORBIT_QUICK_ACTION', JSON.stringify(quickOrbit));

            const relevantErrors = consoleErrors.filter(x => !/favicon|Failed to load resource.*404/i.test(x));
            console.log('CONSOLE_ERRORS', JSON.stringify(relevantErrors));
            assert.equal(relevantErrors.length, 0, 'Browser console contained runtime errors');
            assert.equal(quickOrbit.source, 'HORIZONS', 'Selected-object orbit quick action is still gated to localhost');

            await browser.close();
          })().catch(err => { console.error(err.stack || err); process.exit(1); });
          NODE
