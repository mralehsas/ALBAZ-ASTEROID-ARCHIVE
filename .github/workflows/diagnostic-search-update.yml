name: Diagnostic search and update

on:
  push:
    branches:
      - fix/live-search-update
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/live-search-update
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact frontend patch
        run: python patch_live_search_update.py
      - name: Live search/update regression
        run: python frontend_search_update_test.py
      - name: Console/live-refresh policy regression
        run: python frontend_console_mode_test.py
      - name: Calculation regression
        run: python frontend_calculation_test.py
      - name: Scientific self-test
        run: python self_test.py
      - name: Deployment regression suite
        run: python deployment_test.py
      - name: Compile Python modules
        run: python -m compileall -q api_core.py pythonanywhere_wsgi.py server.py database.py update_data.py update_engine.py horizons_engine.py
      - name: Commit patched frontend if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already contains the fix"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: restore live search archive and cloud refresh"
          git push origin HEAD:fix/live-search-update
