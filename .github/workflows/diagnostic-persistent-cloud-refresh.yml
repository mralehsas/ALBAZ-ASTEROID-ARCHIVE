name: Diagnostic persistent cloud refresh

on:
  push:
    branches:
      - fix/persistent-cloud-refresh
  workflow_dispatch:

permissions:
  contents: read

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Persistent cloud refresh regression
        run: python cloud_persistent_refresh_test.py
