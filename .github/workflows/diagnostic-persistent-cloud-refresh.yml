name: Diagnostic persistent cloud refresh

on:
  push:
    branches:
      - fix/persistent-cloud-refresh
  workflow_dispatch:

permissions:
  contents: write

jobs:
  red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact persisted-refresh patch
        run: python patch_persistent_cloud_refresh.py
      - name: Persistent cloud refresh regression
        run: python cloud_persistent_refresh_test.py
      - name: Search/update regression
        run: python frontend_search_update_test.py
      - name: Console-mode regression
        run: python frontend_console_mode_test.py
      - name: Calculation regression
        run: python frontend_calculation_test.py
      - name: Scientific self-test
        run: python self_test.py
      - name: Deployment regression suite
        run: python deployment_test.py
      - name: Compile Python modules
        run: python -m compileall -q api_core.py pythonanywhere_wsgi.py server.py database.py update_data.py update_engine.py horizons_engine.py cloud_persistent_refresh_test.py
      - name: Commit repaired production files
        shell: bash
        run: |
          if git diff --quiet -- api_core.py index.html; then
            echo "Production files already patched"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api_core.py index.html
          git commit -m "fix: persist bounded cloud NASA refresh"
          git push origin HEAD:fix/persistent-cloud-refresh
