name: Apply calculation path fixes

on:
  push:
    branches:
      - fix/frontend-calculation-paths
    paths:
      - '.github/workflows/apply-calculation-fixes.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/frontend-calculation-paths
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply minimal frontend fixes
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changes = [
              (
                  '<input id="analyzerDiameter" type="number" min="0.01" step="0.1" value="20">',
                  '<input id="analyzerDiameter" type="number" min="0.01" step="0.01" value="20">',
              ),
              (
                  'if (isLocalServer()) await loadHorizonsTrack();',
                  'if (backendApiAvailable()) await loadHorizonsTrack();',
              ),
          ]
          for old, new in changes:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence, found {count}: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Frontend calculation regression
        run: python frontend_calculation_test.py
      - name: Console-only UI regression
        run: python frontend_console_mode_test.py
      - name: Scientific self-test
        run: python self_test.py
      - name: Deployment regression suite
        run: python deployment_test.py
      - name: Compile Python modules
        run: python -m compileall -q api_core.py runtime_paths.py database.py horizons_engine.py jpl_client.py update_engine.py server.py pythonanywhere_wsgi.py self_test.py deployment_test.py frontend_calculation_test.py frontend_console_mode_test.py
      - name: Commit verified production fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore web calculation submit and live orbit path'
          git push origin HEAD:fix/frontend-calculation-paths
