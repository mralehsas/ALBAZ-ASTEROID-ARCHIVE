name: Frontend console-only UI test

on:
  push:
    branches:
      - fix/pythonanywhere-console-ui

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Console-only regression test
        run: python frontend_console_mode_test.py
