name: Frontend calculation regression

on:
  push:
    branches:
      - main
      - fix/frontend-calculation-paths
      - fix/live-search-update
      - fix/persistent-cloud-refresh
      - fix/pythonanywhere-sqlite-safety
      - fix/pythonanywhere-sqlite-startup-lock-v2
      - seo/search-indexing-fix
    paths:
      - 'index.html'
      - 'web-config.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'README.md'
      - 'seo_contract_test.py'
      - 'api_core.py'
      - 'cloud_sqlite.py'
      - 'pythonanywhere_wsgi.py'
      - 'pythonanywhere_update.py'
      - 'cloud_sqlite_test.py'
      - 'cloud_sqlite_lock_regression_test.py'
      - 'cloud_persistent_refresh_test.py'
      - 'frontend_calculation_test.py'
      - 'frontend_console_mode_test.py'
      - 'frontend_search_update_test.py'
      - 'self_test.py'
      - 'deployment_test.py'
      - '.github/workflows/frontend-calculation-regression.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'index.html'
      - 'web-config.js'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'README.md'
      - 'seo_contract_test.py'
      - 'api_core.py'
      - 'cloud_sqlite.py'
      - 'pythonanywhere_wsgi.py'
      - 'pythonanywhere_update.py'
      - 'cloud_sqlite_test.py'
      - 'cloud_sqlite_lock_regression_test.py'
      - 'cloud_persistent_refresh_test.py'
      - 'frontend_calculation_test.py'
      - 'frontend_console_mode_test.py'
      - 'frontend_search_update_test.py'
      - 'self_test.py'
      - 'deployment_test.py'
      - '.github/workflows/frontend-calculation-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: SEO indexing contract
        run: python seo_contract_test.py
      - name: PythonAnywhere SQLite safety regression
        run: python cloud_sqlite_test.py
      - name: PythonAnywhere live-peer SQLite regression
        run: python cloud_sqlite_lock_regression_test.py
      - name: Persisted cloud refresh regression
        run: python cloud_persistent_refresh_test.py
      - name: Frontend calculation regression
        run: python frontend_calculation_test.py
      - name: PythonAnywhere console/live-refresh regression
        run: python frontend_console_mode_test.py
      - name: Live search/update regression
        run: python frontend_search_update_test.py
      - name: Scientific self-test
        run: python self_test.py
      - name: Deployment regression suite
        run: python deployment_test.py
      - name: Compile Python modules
        run: python -m compileall -q api_core.py runtime_paths.py database.py cloud_sqlite.py horizons_engine.py jpl_client.py update_engine.py update_data.py pythonanywhere_update.py server.py pythonanywhere_wsgi.py self_test.py deployment_test.py cloud_sqlite_test.py cloud_sqlite_lock_regression_test.py cloud_persistent_refresh_test.py frontend_calculation_test.py frontend_console_mode_test.py frontend_search_update_test.py seo_contract_test.py
