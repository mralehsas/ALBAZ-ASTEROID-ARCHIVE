name: Production smoke

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'web-config.js'
      - '.github/workflows/production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Wait for GitHub Pages deployment
        shell: python
        run: |
          import time
          import urllib.request

          base = 'https://mralehsas.github.io/ALBAZ-ASTEROID-ARCHIVE/'
          deadline = time.time() + 360
          last = ''
          while time.time() < deadline:
              url = base + '?deploy_probe=' + str(int(time.time()))
              try:
                  req = urllib.request.Request(url, headers={'Cache-Control':'no-cache','User-Agent':'ALBAZ-Production-Smoke/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      last = r.read().decode('utf-8', errors='replace')
                  if (
                      'id="analyzerDiameter" type="number" min="0.01" step="0.01" value="20"' in last
                      and 'if (backendApiAvailable()) await loadHorizonsTrack();' in last
                      and "endpoint('object', { sstr: value, refresh: '1' })" in last
                      and "consoleOnly ? t('refreshLiveNasa') : t('startNasaUpdate')" in last
                  ):
                      print('GitHub Pages contains the repaired calculation, search and live-refresh paths.')
                      raise SystemExit(0)
              except Exception as exc:
                  print('Pages probe:', type(exc).__name__, str(exc)[:300])
              time.sleep(10)
          raise SystemExit('Timed out waiting for repaired GitHub Pages deployment')
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver library
        run: npm install --no-save puppeteer-core@24
      - name: Exercise production search, refresh, calculator and orbit
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const assert = require('node:assert/strict');
          const sleep = ms => new Promise(r => setTimeout(r, ms));

          (async () => {
            const browser = await puppeteer.launch({
              executablePath: process.env.CHROME,
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage']
            });
            const page = await browser.newPage();
            page.setDefaultTimeout(180000);
            const consoleErrors = [];
            const horizonRequests = [];
            const apiRequests = [];
            const apiResponses = [];

            page.on('console', msg => {
              if (msg.type() === 'error') consoleErrors.push(msg.text());
              console.log('BROWSER', msg.type(), msg.text());
            });
            page.on('pageerror', err => consoleErrors.push('PAGEERROR ' + err.message));
            page.on('request', req => {
              const url = req.url();
              if (url.includes('omaralbaz9.pythonanywhere.com/api/')) apiRequests.push(url);
              if (url.includes('/api/horizons/track')) {
                horizonRequests.push(url);
                console.log('HORIZONS_REQUEST', url);
              }
            });
            page.on('response', res => {
              const url = res.url();
              if (url.includes('omaralbaz9.pythonanywhere.com/api/')) apiResponses.push([res.status(), url]);
              if (url.includes('/api/horizons/track')) console.log('HORIZONS_RESPONSE', res.status(), url);
            });

            await page.goto('https://mralehsas.github.io/ALBAZ-ASTEROID-ARCHIVE/?smoke=' + Date.now(), {
              waitUntil: 'networkidle2', timeout: 120000
            });
            await page.waitForFunction(() => document.querySelector('#connectionText')?.textContent.includes('Backend Online'), {timeout:30000});
            await page.waitForFunction(() => document.querySelector('#loadingOverlay')?.hidden === true, {timeout:120000});

            // Search must use the archive-aware object endpoint and persist the profile.
            const beforeHealth = await page.evaluate(async () => {
              const r = await fetch('https://omaralbaz9.pythonanywhere.com/api/health', {cache:'no-store'});
              return await r.json();
            });
            apiRequests.length = 0;
            apiResponses.length = 0;
            await page.$eval('#globalSearch', el => { el.value='101955'; el.dispatchEvent(new Event('input',{bubbles:true})); });
            await page.focus('#globalSearch');
            await page.keyboard.press('Enter');
            await page.waitForFunction(() => /Bennu|101955/i.test(document.querySelector('#dialogTitle')?.textContent || ''), {timeout:60000});
            await sleep(300);
            const objectRequest = apiRequests.find(u => u.includes('/api/object?') && u.includes('refresh=1'));
            console.log('SEARCH_OBJECT_REQUEST', objectRequest || 'NONE');
            assert.ok(objectRequest, 'Public search did not use archive-aware /api/object?refresh=1');
            assert.ok(apiResponses.some(([status,u]) => status === 200 && u.includes('/api/object?')), 'Archive-aware search did not return HTTP 200');
            const afterHealth = await page.evaluate(async () => {
              const r = await fetch('https://omaralbaz9.pythonanywhere.com/api/health', {cache:'no-store'});
              return await r.json();
            });
            assert.ok(Number(afterHealth.counts?.objects || 0) >= Number(beforeHealth.counts?.objects || 0), 'Stored object count decreased after search');
            console.log('SEARCH_COUNTS', JSON.stringify({before:beforeHealth.counts?.objects, after:afterHealth.counts?.objects}));
            await page.evaluate(() => { const d=document.querySelector('#objectDialog'); if (d?.open) d.close(); });
            await page.$eval('#globalSearch', el => { el.value=''; el.dispatchEvent(new Event('input',{bubbles:true})); });

            // Cloud update button must perform an actual live data refresh.
            await page.click('#openNasaEngineButton');
            await page.waitForFunction(() => {
              const button = document.querySelector('#startNasaUpdateButton');
              return button && button.offsetParent !== null && !button.disabled;
            }, {timeout:10000});
            const refreshLabel = await page.$eval('#startNasaUpdateButton b', el => el.textContent.trim());
            console.log('LIVE_REFRESH_LABEL', refreshLabel);
            apiRequests.length = 0;
            apiResponses.length = 0;
            await page.click('#startNasaUpdateButton');
            await page.waitForFunction(() => document.querySelector('#loadingOverlay')?.hidden === true, {timeout:120000});
            await sleep(500);
            console.log('LIVE_REFRESH_REQUESTS', JSON.stringify(apiRequests));
            assert.ok(apiRequests.some(u => u.includes('/api/cad?')), 'Live refresh did not request CAD');
            assert.ok(apiRequests.some(u => u.includes('/api/fireball')), 'Live refresh did not request Fireball');
            assert.ok(apiRequests.some(u => u.includes('/api/sentry')), 'Live refresh did not request Sentry');
            assert.ok(apiResponses.some(([status,u]) => status === 200 && u.includes('/api/cad?')), 'CAD refresh did not return HTTP 200');
            assert.ok(apiResponses.some(([status,u]) => status === 200 && u.includes('/api/fireball')), 'Fireball refresh did not return HTTP 200');
            assert.ok(apiResponses.some(([status,u]) => status === 200 && u.includes('/api/sentry')), 'Sentry refresh did not return HTTP 200');

            await page.click('[data-view-target="analyzer"]');
            const validity = await page.$eval('#analyzerForm', form => ({
              valid: form.checkValidity(),
              diameter: document.querySelector('#analyzerDiameter').value,
              step: document.querySelector('#analyzerDiameter').step,
            }));
            console.log('ANALYZER_VALIDITY', JSON.stringify(validity));
            assert.equal(validity.valid, true, 'Analyzer form must accept its default values');
            assert.equal(validity.step, '0.01');
            await page.click('#analyzerForm button[type="submit"]');
            const analyzer = await page.evaluate(() => ({
              volume: document.querySelector('#resultVolume')?.textContent?.trim(),
              mass: document.querySelector('#resultMass')?.textContent?.trim(),
              energy: document.querySelector('#resultEnergy')?.textContent?.trim(),
              tnt: document.querySelector('#resultTnt')?.textContent?.trim(),
            }));
            console.log('ANALYZER_RESULT', JSON.stringify(analyzer));
            for (const [key, value] of Object.entries(analyzer)) {
              assert.ok(value && value !== '—', `Analyzer ${key} did not render`);
            }

            await page.click('[data-view-target="approaches"]');
            await page.waitForSelector('button.table-action[data-approach-index]', {timeout:30000});
            await page.click('button.table-action[data-approach-index]');
            await page.waitForFunction(() => !document.querySelector('#openOrbitButton')?.disabled, {timeout:10000});

            await page.click('[data-view-target="orbit"]');
            await page.click('#loadReferenceOrbitButton');
            await page.waitForFunction(() => document.querySelector('#orbitMetricSource')?.textContent.trim() === 'LOCAL', {timeout:10000});
            await page.click('[data-view-target="approaches"]');
            const before = horizonRequests.length;
            await page.click('#openOrbitButton');
            await page.waitForFunction(() => document.querySelector('#orbitMetricSource')?.textContent.trim() === 'HORIZONS', {timeout:120000});
            await sleep(500);
            const quick = await page.evaluate(() => ({
              source: document.querySelector('#orbitMetricSource')?.textContent?.trim(),
              target: document.querySelector('#orbitTarget')?.value,
              points: document.querySelector('#orbitMetricPoints')?.textContent?.trim(),
              active: document.querySelector('#view-orbit')?.classList.contains('active')
            }));
            console.log('QUICK_ORBIT_RESULT', JSON.stringify(quick));
            assert.ok(horizonRequests.length > before, 'Quick orbit must issue a live Horizons request');
            assert.equal(quick.source, 'HORIZONS');
            assert.equal(quick.active, true);
            assert.ok(quick.points && quick.points !== '—');

            const relevantErrors = consoleErrors.filter(x => !/favicon|Failed to load resource.*404/i.test(x));
            console.log('CONSOLE_ERRORS', JSON.stringify(relevantErrors));
            assert.deepEqual(relevantErrors, []);
            await browser.close();
          })().catch(err => { console.error(err.stack || err); process.exit(1); });
          NODE
