name: Restore ALBAZ bundled seed data

on:
  push:
    branches: [main]
    paths:
      - '.github/albaz-seeds.tgz.b64'
      - '.github/workflows/restore-albaz-seeds.yml'

permissions:
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original seed files
        shell: bash
        run: |
          base64 -d .github/albaz-seeds.tgz.b64 > /tmp/albaz-seeds.tgz
          tar -xzf /tmp/albaz-seeds.tgz
          python -m json.tool data/bootstrap.json >/dev/null
          python -m json.tool data/earth_history.json >/dev/null

      - name: Verify scientific and deployment regressions
        shell: bash
        run: |
          python -m compileall -q api_core.py pythonanywhere_wsgi.py cache_maintenance.py runtime_paths.py database.py horizons_engine.py update_engine.py update_data.py jpl_client.py server.py self_test.py deployment_test.py
          python self_test.py
          python deployment_test.py
          TMP_DATA="$(mktemp -d)"
          ALBAZ_DATA_DIR="$TMP_DATA" python - <<'PY'
          from database import initialize, seed_if_empty, DB_PATH, counts
          initialize(); seed_if_empty()
          c = counts()
          assert DB_PATH.exists()
          assert c['approaches'] > 0
          assert c['fireballs'] > 0
          assert c['meteorites'] > 0
          assert c['impact_structures'] > 0
          print(DB_PATH)
          print(c)
          PY

      - name: Commit restored seed files and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/bootstrap.json data/earth_history.json
          git rm .github/albaz-seeds.tgz.b64 .github/workflows/restore-albaz-seeds.yml
          git commit -m 'fix: restore bundled reference seed data'
          git push origin HEAD:main
