name: Runtime API diagnostics

on:
  push:
    paths:
      - '.github/workflows/runtime-api-diagnostics.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe production backend and CORS
        shell: python
        run: |
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = 'https://omaralbaz9.pythonanywhere.com'
          ORIGIN = 'https://mralehsas.github.io'
          probes = [
              ('health', '/api/health', 20),
              ('cad', '/api/cad?' + urllib.parse.urlencode({
                  'date-min':'2026-09-02','date-max':'2026-09-09','dist-max':'10LD',
                  'diameter':'true','fullname':'true','limit':'10','sort':'date','body':'Earth'}), 45),
              ('fireball', '/api/fireball?' + urllib.parse.urlencode({'limit':'3','sort':'-date'}), 45),
              ('sentry', '/api/sentry', 60),
              ('sbdb', '/api/sbdb?' + urllib.parse.urlencode({'sstr':'99942','phys-par':'true','full-prec':'true'}), 45),
              ('object', '/api/object?' + urllib.parse.urlencode({'sstr':'99942'}), 45),
              ('horizons', '/api/horizons/track?' + urllib.parse.urlencode({
                  'target':'99942','start':'2026-09-02','days':'10','step':'2','timeout':'30'}), 120),
              ('connectivity', '/api/connectivity/test?timeout=8', 120),
              ('local-approaches', '/api/local/approaches?limit=5', 20),
              ('local-fireballs', '/api/local/fireballs?limit=5', 20),
              ('local-meteorites', '/api/local/meteorites?limit=20', 20),
              ('local-impacts', '/api/local/impact-structures?limit=20', 20),
          ]

          failures = []
          for name, path, timeout in probes:
              url = BASE + path
              req = urllib.request.Request(url, headers={
                  'Origin': ORIGIN,
                  'Accept': 'application/json',
                  'User-Agent': 'AsteroidArchiveRuntimeDiagnostic/1.0',
              })
              started = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read()
                      status = r.status
                      cors = r.headers.get('Access-Control-Allow-Origin')
                      ctype = r.headers.get('Content-Type')
                  elapsed = time.time() - started
                  payload = json.loads(raw.decode('utf-8'))
                  summary = {'status':status,'seconds':round(elapsed,2),'cors':cors,'type':ctype}
                  if isinstance(payload, dict):
                      summary['keys'] = sorted(payload.keys())[:20]
                      if 'count' in payload: summary['count'] = payload.get('count')
                      if 'data' in payload and isinstance(payload['data'], list): summary['data_len'] = len(payload['data'])
                      if 'records' in payload and isinstance(payload['records'], list): summary['records_len'] = len(payload['records'])
                      if name == 'health':
                          summary['health_status'] = payload.get('status')
                          summary['counts'] = payload.get('counts')
                      if name == 'horizons':
                          summary['target_points'] = len(payload.get('target_points') or [])
                          summary['earth_points'] = len(payload.get('earth_points') or [])
                          summary['resolved_target'] = payload.get('resolved_target')
                      if name == 'connectivity': summary['connectivity_status'] = payload.get('status')
                  print(name, json.dumps(summary, ensure_ascii=False, default=str))
                  if status != 200:
                      failures.append((name, f'HTTP {status}'))
                  if cors != ORIGIN:
                      failures.append((name, f'CORS={cors!r}'))
              except Exception as exc:
                  elapsed = time.time() - started
                  detail = str(exc)
                  if isinstance(exc, urllib.error.HTTPError):
                      try: detail += ' BODY=' + exc.read().decode('utf-8', errors='replace')[:1200]
                      except Exception: pass
                  print(name, 'ERROR', round(elapsed,2), detail)
                  failures.append((name, detail))

          # Browser preflight used by future POST/JSON requests.
          preflight = urllib.request.Request(
              BASE + '/api/update/start', method='OPTIONS', headers={
                  'Origin': ORIGIN,
                  'Access-Control-Request-Method': 'POST',
                  'Access-Control-Request-Headers': 'Content-Type',
              })
          try:
              with urllib.request.urlopen(preflight, timeout=20) as r:
                  print('preflight', r.status, r.headers.get('Access-Control-Allow-Origin'), r.headers.get('Access-Control-Allow-Methods'))
                  if r.status != 204 or r.headers.get('Access-Control-Allow-Origin') != ORIGIN:
                      failures.append(('preflight', 'invalid response'))
          except Exception as exc:
              print('preflight ERROR', exc)
              failures.append(('preflight', str(exc)))

          print('FAILURES', json.dumps(failures, ensure_ascii=False))
          if failures:
              raise SystemExit(1)
